# Tomcat
server:
  tomcat:
    uri-encoding: UTF-8
    threads:
      max: 1000
      min-spare: 30
  port: 8002
  servlet:
    context-path: /xiaozhi
    session:
      cookie:
        http-only: true

spring:
  # 环境 dev|test|prod
  profiles:
    active: dev
  messages:
    encoding: UTF-8
    basename: i18n/messages
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
      enabled: true
  main:
    allow-bean-definition-overriding: true

# 蛋宝宝小程序配置（使用独立前缀，避免与 WECHAT_MINIPROGRAM_APPID 环境变量冲突）
eggbaby:
  miniprogram:
    appid: ${EGG_MINIPROGRAM_APPID:}
    secret: ${EGG_MINIPROGRAM_SECRET:}

# 微信支付：dev 默认走 mock，生产环境必须显式设置为 false（通过 env: WECHAT_PAY_MOCK=false 或 prod profile 覆盖）
wechat:
  pay:
    mock: true

knife4j:
  enable: true
  basic:
    enable: false
    username: admin
    password: admin
  setting:
    enableFooter: false

# 聊天配额
chat:
  quota:
    # 免费用户每日聊天轮次上限
    free-daily-limit: 30

seedream:
  url: ${EGG_SEED_DREAM_URL:https://ark.cn-beijing.volces.com/api/v3/images/generations}
  model: ${EGG_SEED_DREAM_MODEL:doubao-seedream-5-0-lite-260128}
  size: ${EGG_SEED_DREAM_SIZE:2K}
  stream: false
  watermark: false

renren:
  redis:
    open: true
  xss:
    enabled: true
    exclude-urls:

#mybatis
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  #实体扫描，多个package用逗号或者分号分隔
  typeAliasesPackage: xiaozhi.modules.*.entity
  global-config:
    #数据库相关配置
    db-config:
      #主键类型
      id-type: ASSIGN_ID
    banner: false
  #原生配置
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    call-setters-on-nulls: true
    jdbc-type-for-null: 'null'
  configuration-properties:
    prefix:
    blobType: BLOB
    boolValue: TRUE

# AI宠物头像配置
# pet.avatar.koi-defaults / rabbit-defaults: 默认头像池，分号分隔；未配置时走兜底图
# pet.avatar.koi / rabbit: 扩展头像池，在默认池基础上追加，分号分隔
pet:
  avatar:
    koi-defaults: ""
    rabbit-defaults: ""
    koi: ""
    rabbit: ""
