# buildx 构建器使用的 buildkit 配置
# 用途：为 buildx 容器化构建器配置 Docker Hub 镜像加速，避免国内网络拉取 docker.io 超时
# 注：buildx builder 不读宿主机 daemon.json 的 registry-mirrors，必须在此独立配置

debug = false

[registry."docker.io"]
  mirrors = [
    "docker.m.daocloud.io",
    "docker.1ms.run",
    "docker.1panel.live",
  ]

[registry."docker.m.daocloud.io"]
  http = false
  insecure = false

[registry."docker.1ms.run"]
  http = false
  insecure = false

[registry."docker.1panel.live"]
  http = false
  insecure = false
