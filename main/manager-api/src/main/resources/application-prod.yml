knife4j:
  production: true
  enable: ${KNIFE4J_ENABLE:false}
  basic:
    enable: false
    username: ${KNIFE4J_BASIC_USERNAME:renren}
    password: ${KNIFE4J_BASIC_PASSWORD:}
  setting:
    enableFooter: false

spring:
  datasource:
    druid:
      driver-class-name: com.mysql.cj.jdbc.Driver
      url: ${SPRING_DATASOURCE_DRUID_URL:jdbc:mysql://127.0.0.1:2881/egg_database?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&nullCatalogMeansCurrent=true&useSSL=false&connectTimeout=30000&socketTimeout=120000&rewriteBatchedStatements=true&allowPublicKeyRetrieval=true}
      username: ${SPRING_DATASOURCE_DRUID_USERNAME:root}
      password: ${SPRING_DATASOURCE_DRUID_PASSWORD:}
      initial-size: 8
      max-active: 40
      min-idle: 5
      max-wait: 10000
      pool-prepared-statements: true
      max-pool-prepared-statement-per-connection-size: 20
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      stat-view-servlet:
        enabled: false
      filter:
        stat:
          log-slow-sql: true
          slow-sql-millis: 1000
          merge-sql: false
        wall:
          config:
            multi-statement-allow: true
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:127.0.0.1}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:}
      database: ${SPRING_DATA_REDIS_DATABASE:0}
      timeout: 10000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
        shutdown-timeout: 100ms

wechat:
  pay:
    mock: false

# 蛋宝宝小程序配置（独立前缀，避免与 WECHAT_MINIPROGRAM_APPID 环境变量冲突）
eggbaby:
  miniprogram:
    appid: ${EGG_MINIPROGRAM_APPID:}
    secret: ${EGG_MINIPROGRAM_SECRET:}

# 阿里云OSS配置
aliyun:
  oss:
    endpoint: ${EGG_ENDPOINT:}
    access-key-id: ${EGG_ACCESS_KEY_ID:}
    access-key-secret: ${EGG_ACCESS_KEY_SECRET:}
    bucket-name: ${EGG_BUCKET_NAME:}
    region: ${EGG_REGION:}

seedream:
  key: ${EGG_SEED_DREAM_KEY:}

# Spring Boot Actuator 健康检查端点，仅暴露 health/info
management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

# AI宠物头像配置
# 按原型配置 OSS 基础 URL、文件名前缀与可用数量，破壳时随机生成头像 URL
pet:
  avatar:
    koi:
      base-url: https://oss.eggbabe.com/default-avatar/fish/
      prefix: fish
      count: 22
    rabbit:
      base-url: https://oss.eggbabe.com/default-avatar/rabbit/
      prefix: rabbit
      count: 22
    fallback-url: https://636c-cloud1-9ghrcw8127746c64-1391989435.tcb.qcloud.la/eggbabe/fish.png

# AI宠物收藏卡配置
# 按原型配置 OSS 基础 URL、文件名前缀与可用数量，破壳时随机生成收藏卡 URL
  collection-card:
    koi:
      base-url: https://oss.eggbabe.com/default-card/fish/
      prefix: card-fish
      count: 10
    rabbit:
      base-url: https://oss.eggbabe.com/default-card/rabbit/
      prefix: card-rabbit
      count: 10
    fallback-url: https://oss.eggbabe.com/default-card/fish/card-fish-0.webp

