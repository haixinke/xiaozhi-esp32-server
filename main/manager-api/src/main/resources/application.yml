# Tomcat
server:
  tomcat:
    uri-encoding: UTF-8
    threads:
      max: 1000
      min-spare: 30
  port: 8002
  servlet:
    context-path: /xiaozhi
    session:
      cookie:
        http-only: true

spring:
  # 环境 dev|test|prod
  profiles:
    active: dev
  messages:
    encoding: UTF-8
    basename: i18n/messages
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
      enabled: true
  main:
    allow-bean-definition-overriding: true

# 蛋宝宝小程序配置（使用独立前缀，避免与 WECHAT_MINIPROGRAM_APPID 环境变量冲突）
eggbaby:
  miniprogram:
    appid: ${EGG_MINIPROGRAM_APPID:}
    secret: ${EGG_MINIPROGRAM_SECRET:}

# 微信支付：dev 默认走 mock，生产环境必须显式设置为 false（通过 env: WECHAT_PAY_MOCK=false 或 prod profile 覆盖）
wechat:
  pay:
    mock: true

knife4j:
  enable: true
  basic:
    enable: false
    username: admin
    password: admin
  setting:
    enableFooter: false

# 聊天配额
chat:
  quota:
    # 免费用户每日聊天轮次上限
    free-daily-limit: 30

seedream:
  url: ${EGG_SEED_DREAM_URL:https://ark.cn-beijing.volces.com/api/v3/images/generations}
  model: ${EGG_SEED_DREAM_MODEL:doubao-seedream-5-0-lite-260128}
  size: ${EGG_SEED_DREAM_SIZE:2K}
  stream: false
  watermark: false
  key: ${EGG_SEED_DREAM_KEY:}

# 阿里云OSS配置（未配置时回退到数据库BLOB存储）
aliyun:
  oss:
    endpoint: ${EGG_ENDPOINT:}
    access-key-id: ${EGG_ACCESS_KEY_ID:}
    access-key-secret: ${EGG_ACCESS_KEY_SECRET:}
    bucket-name: ${EGG_BUCKET_NAME:}
    region: ${EGG_REGION:}
    # OSS 公网访问域名，用于把 ossKey 拼接成可访问 URL；留空时由 OssService 兜底
    public-url: ${EGG_OSS_PUBLIC_URL:}

renren:
  redis:
    open: true
  xss:
    enabled: true
    exclude-urls:

#mybatis
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  #实体扫描，多个package用逗号或者分号分隔
  typeAliasesPackage: xiaozhi.modules.*.entity
  global-config:
    #数据库相关配置
    db-config:
      #主键类型
      id-type: ASSIGN_ID
    banner: false
  #原生配置
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    call-setters-on-nulls: true
    jdbc-type-for-null: 'null'
  configuration-properties:
    prefix:
    blobType: BLOB
    boolValue: TRUE

# 快速破壳演示配置
# 演示用特殊邀请码，输入此码领养后孵化进度直接100%，可立即破壳
# 生产环境可通过环境变量 PET_QUICK_HATCH_CODE 修改或留空禁用
pet:
  quick-hatch:
    code: ${PET_QUICK_HATCH_CODE:}

# AI宠物头像配置
# 按原型配置 OSS 基础 URL、文件名前缀与可用数量，破壳时随机生成头像 URL
  avatar:
    koi:
      base-url: https://oss.eggbabe.com/default-avatar/fish/
      prefix: fish
      count: 22
    rabbit:
      base-url: https://oss.eggbabe.com/default-avatar/rabbit/
      prefix: rabbit
      count: 22
    fallback-url: https://oss.eggbabe.com/default-avatar/fish/fish-0.png

# AI宠物收藏卡配置
# 按原型配置 OSS 基础 URL、文件名前缀与可用数量，破壳时随机生成收藏卡 URL
  collection-card:
    koi:
      base-url: https://oss.eggbabe.com/default-card/fish/
      prefix: card-fish
      count: 10
    rabbit:
      base-url: https://oss.eggbabe.com/default-card/rabbit/
      prefix: card-rabbit
      count: 10
    fallback-url: https://oss.eggbabe.com/default-card/fish/card-fish-0.webp

# AI宠物场景图配置
# 按原型配置 OSS 基础 URL、文件名前缀与可用数量，破壳时随机生成场景图 URL
  scene:
    koi:
      base-url: https://oss.eggbabe.com/default-scenes/fish/
      prefix: scenes-fish
      count: 6
    rabbit:
      base-url: https://oss.eggbabe.com/default-scenes/rabbit/
      prefix: scenes-rabbit
      count: 6

# PDC NFC 实物生产域配置（fail-closed：所有功能默认关闭）
# 开关按环节分三道门：Scheme 生成（生产）、出库激活、用户领取，任一环节可独立灰度或熔断
pdc:
  nfc:
    # NFC 功能总开关：关闭时批次创建、出库激活、领取等全部入口拒绝访问
    enabled: ${PDC_NFC_ENABLED:false}
    # 微信审核通过的设备类型编号（model_id），所有蛋宝宝共用一个；为空或占位符时禁止调用 generatenfcscheme
    model-id: ${PDC_NFC_MODEL_ID:}
    # 当前线上小程序版本号，须与后台登记的发布证据 releaseVersion 完全一致，否则发布证据校验不通过
    release-version: ${PDC_NFC_RELEASE_VERSION:}
    # 小程序发布就绪标志：证明领取页 /pages/nfc-claim/nfc-claim 已随正式版发布；Scheme 生成、激活、领取均要求开启
    release-ready: ${PDC_NFC_RELEASE_READY:false}
    # Scheme 生成任务开关（生产环节灰度/熔断）
    scheme-generation-enabled: ${PDC_NFC_SCHEME_GENERATION_ENABLED:false}
    # 出库激活开关（激活环节灰度/熔断）：控制资产能否从 IN_STOCK 推进到 ACTIVE
    activation-enabled: ${PDC_NFC_ACTIVATION_ENABLED:false}
    # 用户领取开关（领取环节灰度/熔断）：控制小程序 preview/confirm 接口可用性
    claim-enabled: ${PDC_NFC_CLAIM_ENABLED:false}
    # 单个生产批次数量上限，创建批次时 plannedQuantity 必须在 1 ~ 此值之间
    max-batch-quantity: ${PDC_NFC_MAX_BATCH_QUANTITY:10000}
    # claimRef 保护密钥（active/previous 双版本，支持轮换；previous 仅过渡期保留，旧标签锁卡后无法召回）
    claim-ref:
      # 当前密钥版本号，生成资产时写入 claim_ref_hash_version
      active-version: ${PDC_NFC_CLAIM_ACTIVE_VERSION:}
      # 当前 HMAC-SHA-256 密钥（Base64）：claimRef 明文不落库，按此哈希查找资产；须与 AES 密钥不同
      active-hmac-key-base64: ${PDC_NFC_ACTIVE_HMAC_KEY_BASE64:}
      # 当前 AES-256-GCM 密钥（Base64，解码后须 32 字节）：加密 claimRef 与 Scheme URL，assetId 作 AAD
      active-aes-key-base64: ${PDC_NFC_ACTIVE_AES_KEY_BASE64:}
      # 上一版密钥版本号，轮换完成后清空
      previous-version: ${PDC_NFC_CLAIM_PREVIOUS_VERSION:}
      # 上一版 HMAC-SHA-256 密钥（Base64）：仅轮换过渡期用于旧标签查找
      previous-hmac-key-base64: ${PDC_NFC_PREVIOUS_HMAC_KEY_BASE64:}
      # 上一版 AES-256-GCM 密钥（Base64）：仅用于解密旧版本密文
      previous-aes-key-base64: ${PDC_NFC_PREVIOUS_AES_KEY_BASE64:}
