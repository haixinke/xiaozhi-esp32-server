# OceanBase SeekDB for PowerMem
# 用于 xiaozhi-esp32-server 的记忆存储，支持用户画像和知识图谱
# 使用轻量级 SeekDB 镜像，适合开发环境

services:
  seekdb:
    image: oceanbase/seekdb:latest
    container_name: seekdb
    restart: always
    ports:
      - "2881:2881"  # SQL port (MySQL 兼容)
    environment:
      - MODE=slim  # 轻量级模式，适合开发环境
      - TZ=Asia/Shanghai
      - REPORTER=docker-seekdb
    volumes:
      # 数据持久化：seekdb 实际读写 /var/lib/oceanbase/，必须挂载此路径才能持久化
      # 默认挂载到项目外的 ~/dockervol/oceanbase/seekdb-data，避免数据被误拷入镜像或被 IDE/git 扫描
      # 可通过环境变量 OCEANBASE_DATA_DIR 覆盖，例：OCEANBASE_DATA_DIR=/data/seekdb docker compose up -d
      - ${OCEANBASE_DATA_DIR:-~/dockervol/oceanbase/seekdb-data}:/var/lib/oceanbase
    healthcheck:
      # seekdb slim 镜像不含 obclient，改用 mysql 客户端做连通性探测
      test: ["CMD", "mysql", "-h127.0.0.1", "-P2881", "-uroot", "-p123456", "-e", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s  # slim 模式启动较快
    networks:
      - xiaozhi-network

networks:
  xiaozhi-network:
    driver: bridge
