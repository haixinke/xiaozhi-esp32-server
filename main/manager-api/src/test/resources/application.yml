spring:
  messages:
    encoding: UTF-8
    basename: i18n/messages
  data:
    redis:
      # REDIS_HOST 环境变量可覆盖主机地址（如容器内用 host.docker.internal）
      host: ${REDIS_HOST:localhost}
      port: 6379
      database: 0
      timeout: 10s
      lettuce:
        pool:
          min-idle: 0
          max-idle: 8
          max-active: 8
          max-wait: -1ms

renren:
  redis:
    open: true

logging:
  level:
    xiaozhi.modules.device: DEBUG
    org.springframework.data.redis: DEBUG
