knife4j:
  production: true
  enable: ${KNIFE4J_ENABLE:false}
  basic:
    enable: false
    username: ${KNIFE4J_BASIC_USERNAME:renren}
    password: ${KNIFE4J_BASIC_PASSWORD:}
  setting:
    enableFooter: false

spring:
  datasource:
    druid:
      driver-class-name: com.mysql.cj.jdbc.Driver
      url: ${SPRING_DATASOURCE_DRUID_URL:jdbc:mysql://127.0.0.1:2881/egg_database?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&nullCatalogMeansCurrent=true}
      username: ${SPRING_DATASOURCE_DRUID_USERNAME:root}
      password: ${SPRING_DATASOURCE_DRUID_PASSWORD:}
      initial-size: 10
      max-active: 100
      min-idle: 10
      max-wait: 6000
      pool-prepared-statements: true
      max-pool-prepared-statement-per-connection-size: 20
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      stat-view-servlet:
        enabled: false
      filter:
        stat:
          log-slow-sql: true
          slow-sql-millis: 1000
          merge-sql: false
        wall:
          config:
            multi-statement-allow: true
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:127.0.0.1}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:}
      database: ${SPRING_DATA_REDIS_DATABASE:0}
      timeout: 10000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
        shutdown-timeout: 100ms

wechat:
  miniprogram:
    appid: ${WECHAT_MINIPROGRAM_APPID:}
    secret: ${WECHAT_MINIPROGRAM_SECRET:}
  #    appid: ${EGG_MINIPROGRAM_APPID:}
  #    secret: ${EGG_MINIPROGRAM_SECRET:}
  pay:
    mock: false

# 阿里云OSS配置
aliyun:
  oss:
    endpoint: ${EGG_ENDPOINT:}
    access-key-id: ${EGG_ACCESS_KEY_ID:}
    access-key-secret: ${EGG_ACCESS_KEY_SECRET:}
    bucket-name: ${EGG_BUCKET_NAME:}
    region: ${EGG_REGION:}

# Spring Boot Actuator 健康检查端点，仅暴露 health/info
management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

# AI宠物头像配置
# pet.avatar.koi-defaults / rabbit-defaults: 默认头像池，分号分隔；未配置时走兜底图
# pet.avatar.koi / rabbit: 扩展头像池，在默认池基础上追加，分号分隔
pet:
