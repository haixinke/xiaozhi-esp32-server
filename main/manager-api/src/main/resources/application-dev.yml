# dev 环境差异配置（公共配置见 application.yml）
knife4j:
  production: false
  basic:
    username: renren
    password: 2ZABCDEUgF

spring:
  datasource:
    druid:
      #OceanBase (MySQL 兼容模式)
      driver-class-name: com.mysql.cj.jdbc.Driver
      # socketTimeout/connectTimeout 让失效连接快速失败，避免 OBProxy 静默关闭后写入挂起 10s
      url: jdbc:mysql://127.0.0.1:2881/egg_database?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&nullCatalogMeansCurrent=true&useSSL=false&allowPublicKeyRetrieval=true&socketTimeout=5000&connectTimeout=5000
      username: root
      password: 123456
      initial-size: 10
      max-active: 100
      min-idle: 10
      max-wait: 6000
      pool-prepared-statements: true
      max-pool-prepared-statement-per-connection-size: 20
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      test-while-idle: true
      # OceanBase OBProxy 会静默关闭空闲服务端连接，borrow 时校验 + 主动保活，防止给业务发放半开连接
      test-on-borrow: true
      validation-query: SELECT 1
      validation-query-timeout: 2
      keep-alive: true
      keep-alive-between-time-millis: 90000
      test-on-return: false
      stat-view-servlet:
        enabled: false
      filter:
        stat:
          log-slow-sql: true
          slow-sql-millis: 1000
          merge-sql: false
        wall:
          config:
            multi-statement-allow: true
  data:
    redis:
      host: 127.0.0.1         # Redis服务器地址
      port: 6379              # Redis服务器连接端口
      password:              # Redis服务器连接密码（默认为空）
      database: 1            # Redis数据库索引（默认为0）
      timeout: 10000ms       # 连接超时时间（毫秒）
      lettuce:
        pool:
          max-active: 8      # 连接池最大连接数（使用负值表示没有限制）
          max-idle: 8        # 连接池中的最大空闲连接
          min-idle: 0        # 连接池中的最小空闲连接
        shutdown-timeout: 100ms  # 客户端优雅关闭的等待时间
